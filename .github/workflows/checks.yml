name: Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  terraform:
    uses: KandlerLi/gha-common/.github/workflows/terraform-checks.yml@v0.0.7
    with:
      aws_region: us-east-1
      extra_repo_vars: "ALERT_EMAIL"
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      # A caller's job-level permissions cap every nested job inside the
      # reusable workflow -- must cover the union of what any of them
      # ask for, not just one. build-image needs write (pushes to
      # GHCR); packages: read here failed with "requesting
      # 'packages: write', but is only allowed 'packages: read'" the
      # first time this was tried (2026-09-03).
      packages: write
