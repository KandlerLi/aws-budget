name: Apply

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  # The reusable workflow's build-image job pushes to GHCR.
  packages: write

concurrency:
  group: aws-budget-terraform
  cancel-in-progress: false

jobs:
  terraform:
    uses: KandlerLi/gha-common/.github/workflows/terraform-apply.yml@v0.0.17
    with:
      aws_region: us-east-1
    secrets: inherit
